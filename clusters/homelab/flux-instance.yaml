# k8s-infra applies this exact file to bootstrap the cluster. After the first
# sync, Flux manages it like everything else in this repository.
apiVersion: fluxcd.controlplane.io/v1
kind: FluxInstance
metadata:
  name: flux
  namespace: flux-system
spec:
  distribution:
    version: "2.9.x"
    registry: ghcr.io/fluxcd
  cluster:
    type: kubernetes
    size: medium
    # Turns off cross-namespace references, and makes every Kustomization and
    # HelmRelease without serviceAccountName impersonate `<namespace>:flux`.
    multitenant: true
    tenantDefaultServiceAccount: flux
  sync:
    kind: GitRepository
    url: ssh://git@github.com/nathansiegfrid/k8s-fleet.git
    ref: refs/heads/main
    path: ./clusters/homelab
    # Created by k8s-infra from its encrypted secrets.
    pullSecret: flux-system
  # Keep the Flux controllers on the control-plane nodes, where tenants' pods
  # can't run: kustomize-controller and helm-controller are cluster-admin.
  # The toleration is for the masters' NoSchedule taint.
  kustomize:
    patches:
      - target:
          kind: Deployment
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: all
          spec:
            template:
              spec:
                nodeSelector:
                  node-role.kubernetes.io/control-plane: "true"
                tolerations:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
                    effect: NoSchedule
