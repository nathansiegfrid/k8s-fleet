# The platform. Each Kustomization reconciles one component in /platform;
# versions are pinned inside the components.
#
# Platform Kustomizations run as kustomize-controller (cluster-admin). Without
# serviceAccountName, multitenant Flux would impersonate `flux-system:flux`.

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 5m

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/flux-operator
  prune: true
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 10m

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/cilium
  prune: true
  wait: true

---
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  interval: 1h
  url: https://github.com/kubernetes-sigs/gateway-api
  ref:
    # The version Istio 1.31 is built against.
    tag: v1.6.0

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway-api
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 5m

  sourceRef:
    kind: GitRepository
    name: gateway-api
  # The standard channel's CRDs.
  path: ./config/crd
  # Deleting a CRD deletes every object of that kind. Removing this
  # Kustomization must not take every Gateway and route with it.
  prune: false

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 10m

  dependsOn:
    # Istio's CNI plugin chains after Cilium's, and istiod watches Gateway API.
    - name: cilium
    - name: gateway-api

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/istio
  prune: true
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateway
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 5m

  dependsOn:
    # istiod deploys the Gateway's pod, and cert-manager issues its certificate.
    - name: istio
    - name: cert-manager

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/gateway
  prune: true
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: external-dns
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 5m

  # external-dns watches Gateways and HTTPRoutes.
  dependsOn:
    - name: gateway-api

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/external-dns
  prune: true
  wait: true

  # The Cloudflare token is SOPS-encrypted in git. k8s-infra creates the
  # sops-age Secret at bootstrap.
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 5m

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/cert-manager
  prune: true
  wait: true

  # The Cloudflare token is SOPS-encrypted in git.
  decryption:
    provider: sops
    secretRef:
      name: sops-age

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 5m

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/local-path-provisioner
  prune: true
  wait: true
