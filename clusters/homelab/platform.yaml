# The platform. Each Kustomization reconciles one component in /platform;
# versions are pinned inside the components.
#
# Platform Kustomizations run as kustomize-controller (cluster-admin). Without
# serviceAccountName, multitenant Flux would impersonate `flux-system:flux`.

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 5m

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/flux-operator
  prune: true
  wait: true

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 10m

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./platform/cilium
  prune: true
  wait: true
