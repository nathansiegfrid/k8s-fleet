# Cluster-wide policies.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: host-firewall
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 5m

  # CiliumClusterwideNetworkPolicy comes with Cilium.
  dependsOn:
    - name: cilium

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./policies/host-firewall
  prune: true
  wait: true
