# Tenants start once the Gateway, the host firewall, pods' denied egress and
# their admission policies are in place.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 5m

  dependsOn:
    - name: gateway
    - name: host-firewall
    - name: pod-egress
    - name: tenant-policies

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./tenants
  prune: true
  wait: true

  # Each tenant's deploy key and age key are SOPS-encrypted in git.
  decryption:
    provider: sops
    secretRef:
      name: sops-age
