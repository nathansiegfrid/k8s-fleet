# Tenants start once the Gateway, the host firewall and their admission
# policies are in place.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  serviceAccountName: kustomize-controller
  interval: 10m
  timeout: 5m

  dependsOn:
    - name: gateway
    - name: host-firewall
    - name: tenant-policies

  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./tenants
  prune: true
  wait: true
