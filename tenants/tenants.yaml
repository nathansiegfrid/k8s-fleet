# One entry in `inputs` per tenant. Flux Operator generates each tenant's
# namespace, Flux identity and sync from the template below.
apiVersion: fluxcd.controlplane.io/v1
kind: ResourceSet
metadata:
  name: tenants
  namespace: flux-system
spec:
  # Optional per tenant: `path` in the repository, `./` by default;
  # `private: true` to clone with the deploy key in `<tenant>-git`; and
  # `sops: true` to decrypt with the age key in `<tenant>-sops-age`. Both
  # Secrets are in this namespace, SOPS-encrypted in this folder.
  inputs:
    - tenant: tenant-01
      repository: https://github.com/nathansiegfrid/k8s-apps
      branch: main
    - tenant: tenant-01-workbench
      repository: ssh://git@github.com/nathansiegfrid/workbench
      branch: main
      path: ./deployments
      private: true
      sops: true

  resources:
    # Removing a tenant from `inputs` keeps its namespace and everything in
    # it. Deleting the namespace is a separate, deliberate step.
    - apiVersion: v1
      kind: Namespace
      metadata:
        name: << inputs.tenant >>
        annotations:
          fluxcd.controlplane.io/prune: disabled
        labels:
          # The tenant admission policies apply where this label is set.
          tenant: << inputs.tenant >>
          istio.io/dataplane-mode: ambient
          pod-security.kubernetes.io/enforce: restricted
          pod-security.kubernetes.io/audit: restricted
          pod-security.kubernetes.io/warn: restricted

    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: flux
        namespace: << inputs.tenant >>

    # `admin` in the tenant's namespace only: workloads, Services, Roles and
    # Flux objects, but not its ResourceQuota, LimitRange or Namespace.
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: flux
        namespace: << inputs.tenant >>
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: ClusterRole
        name: admin
      subjects:
        - kind: ServiceAccount
          name: flux
          namespace: << inputs.tenant >>

    # The tenant's pods accept connections from its own namespace and the
    # Gateways only, so tenants can't reach each other. A tenant could delete
    # it, which only opens its own pods, and Flux Operator puts it back.
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: default
        namespace: << inputs.tenant >>
      spec:
        podSelector: {}
        policyTypes: [Ingress]
        ingress:
          - from:
              - podSelector: {}
          # In ambient mode, traffic between pods arrives on ztunnel's port.
          - from:
              - namespaceSelector:
                  matchLabels:
                    kubernetes.io/metadata.name: gateway
                podSelector:
                  matchExpressions:
                    - key: gateway.networking.k8s.io/gateway-name
                      operator: Exists
            ports:
              - port: 15008
                protocol: TCP

  # The sync, in a template so each tenant's optional parts are left out
  # when unset.
  resourcesTemplate: |
    ---
    apiVersion: source.toolkit.fluxcd.io/v1
    kind: GitRepository
    metadata:
      name: apps
      namespace: << inputs.tenant >>
    spec:
      interval: 5m
      url: << inputs.repository >>
      ref:
        branch: << inputs.branch >>
      <<- if get inputs "private" >>
      secretRef:
        name: apps-git
      <<- end >>
    ---
    apiVersion: kustomize.toolkit.fluxcd.io/v1
    kind: Kustomization
    metadata:
      name: apps
      namespace: << inputs.tenant >>
    spec:
      serviceAccountName: flux
      targetNamespace: << inputs.tenant >>
      interval: 10m
      sourceRef:
        kind: GitRepository
        name: apps
      path: << get inputs "path" | default "./" >>
      prune: true
      # Leave the tenant's workloads running if this Kustomization is
      # deleted, e.g. when the tenant is removed from `inputs`.
      deletionPolicy: Orphan
      <<- if get inputs "sops" >>
      decryption:
        provider: sops
        secretRef:
          name: sops-age
      <<- end >>
    <<- if get inputs "private" >>
    ---
    # Copied from flux-system, which exists before the tenant's namespace.
    apiVersion: v1
    kind: Secret
    metadata:
      name: apps-git
      namespace: << inputs.tenant >>
      annotations:
        fluxcd.controlplane.io/copyFrom: flux-system/<< inputs.tenant >>-git
    <<- end >>
    <<- if get inputs "sops" >>
    ---
    apiVersion: v1
    kind: Secret
    metadata:
      name: sops-age
      namespace: << inputs.tenant >>
      annotations:
        fluxcd.controlplane.io/copyFrom: flux-system/<< inputs.tenant >>-sops-age
    <<- end >>
