# Each tenant's deploy key and age key, which the ResourceSet copies into its
# namespace. Created with `sops`, so they're never in git in plaintext.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - tenant-01-workbench-git.sops.yaml
  - tenant-01-workbench-sops-age.sops.yaml
