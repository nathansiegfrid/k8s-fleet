apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: rke2-all-nodes
spec:
  nodeSelector:
    matchLabels: {}
  ingress:
    # Public: ping, ICMP errors, HTTP(S) and WireGuard.
    - icmps:
        - fields:
            - type: EchoRequest
              family: IPv4
            # Allows "fragmentation needed", which path MTU discovery needs.
            - type: DestinationUnreachable
              family: IPv4
            # Allows ICMP Time Exceeded replies for traceroute run from a node.
            # The routers' replies arrive as world -> host, so without this rule
            # they're dropped, because Cilium doesn't treat them as part of the
            # outgoing probe's connection as it does for TCP and UDP replies.
            - type: TimeExceeded
              family: IPv4
    - toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "41820" # WireGuard
              protocol: UDP

    # Kubelet API and metrics.
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP

    # Kubelet API for metrics-server, which scrapes every node's kubelet from
    # its pod, so it arrives with the pod's identity.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            app.kubernetes.io/name: rke2-metrics-server
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP

    # Cilium health checks. Every node's agent probes every other node's on
    # 4240, as `remote-node`.
    - fromEntities:
        - health
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4240"
              protocol: TCP

    # Hubble Relay gathers every node's flows from its Hubble server.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cilium-system
            app.kubernetes.io/name: hubble-relay
      toPorts:
        - ports:
            - port: "4244"
              protocol: TCP

    # Cilium VXLAN overlay between nodes.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8472"
              protocol: UDP

    # Istio's rules are off while audit mode is on: Hubble's export will show
    # whether anything, like a host-network Gateway, still needs them.

    # # Istio ambient (ztunnel) between nodes.
    # - fromEntities:
    #     - host
    #     - remote-node
    #   toPorts:
    #     - ports:
    #         - port: "15008" # HBONE mTLS tunnel
    #           protocol: TCP
    #         - port: "15020" # Merged Prometheus telemetry
    #           protocol: TCP
    #         - port: "15021" # Health check
    #           protocol: TCP
    #         - port: "15090" # Envoy Prometheus telemetry
    #           protocol: TCP

    # # istiod from inside the cluster.
    # - fromEntities:
    #     - cluster
    #   toPorts:
    #     - ports:
    #         - port: "15010" # XDS, plaintext gRPC
    #           protocol: TCP
    #         - port: "15012" # XDS, mTLS gRPC
    #           protocol: TCP
    #         - port: "15014" # Control-plane metrics
    #           protocol: TCP
    #         - port: "15017" # Webhook server
    #           protocol: TCP
