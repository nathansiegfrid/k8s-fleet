apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: rke2-all-nodes
spec:
  nodeSelector:
    matchLabels: {}
  ingress:
    # Public: ping, HTTP(S) and WireGuard.
    - icmps:
        - fields:
            - type: EchoRequest
              family: IPv4
    - toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "41820" # WireGuard
              protocol: UDP

    # SSH only over WireGuard.
    - fromCIDR:
        - 10.0.0.0/24
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP

    # Kubelet API and metrics.
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP

    # Cilium health checks. Every node's agent probes every other node's on
    # 4240, as `remote-node`.
    - fromEntities:
        - health
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "4240"
              protocol: TCP

    # Cilium VXLAN overlay between nodes.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8472"
              protocol: UDP

    # Istio ambient (ztunnel) between nodes.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "15008" # HBONE mTLS tunnel
              protocol: TCP
            - port: "15020" # Merged Prometheus telemetry
              protocol: TCP
            - port: "15021" # Health check
              protocol: TCP
            - port: "15090" # Envoy Prometheus telemetry
              protocol: TCP

    # istiod from inside the cluster.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "15010" # XDS, plaintext gRPC
              protocol: TCP
            - port: "15012" # XDS, mTLS gRPC
              protocol: TCP
            - port: "15014" # Control-plane metrics
              protocol: TCP
            - port: "15017" # Webhook server
              protocol: TCP
