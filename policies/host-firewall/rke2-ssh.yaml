# Separate policy for SSH so a bad edit on another won't lock us out.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: rke2-ssh
spec:
  nodeSelector:
    matchLabels: {}
  ingress:
    # SSH only over WireGuard.
    - fromCIDR:
        - 10.0.0.0/24
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
