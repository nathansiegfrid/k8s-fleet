apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: rke2-api
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: "true"
  ingress:
    # Kubernetes API from inside the cluster.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # RKE2 supervisor API from nodes. Don't remove, this does not overlap with
    # the WireGuard CIDR below: Cilium doesn't match cluster nodes by CIDR, so
    # would remove the nodes' access to this port.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9345" # RKE2 supervisor API
              protocol: TCP

    # Kubernetes API and RKE2 supervisor API from nodes that are still joining.
    # Cilium doesn't treat them as cluster nodes yet, so the identities above
    # won't match.
    - fromCIDR:
        - 10.0.0.0/24
      toPorts:
        - ports:
            - port: "6443" # Kubernetes API
              protocol: TCP
            - port: "9345" # RKE2 supervisor API
              protocol: TCP

    # Kubernetes API from VPN clients.
    - fromCIDR:
        - 10.0.3.0/24
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
