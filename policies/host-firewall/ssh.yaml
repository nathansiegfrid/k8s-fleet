# Separate policy for SSH so a bad edit on another won't lock us out.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ssh
spec:
  nodeSelector:
    matchLabels: {}
  ingress:
    # SSH only from the admin's primary machine.
    # If the primary machine is lost, we can access the nodes through
    # the cloud's web console (tested for current cloud provider).
    - fromCIDR:
        - 10.0.3.1/32
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
