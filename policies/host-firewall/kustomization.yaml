# Cilium host firewall for the RKE2 nodes. Ingress to a node is denied unless a
# rule below allows it; egress is unrestricted.
#
# Port references:
# https://docs.rke2.io/install/requirements#inbound-network-rules
# https://istio.io/latest/docs/ops/deployment/application-requirements/#ports-used-by-istio
# https://docs.cilium.io/en/latest/security/policy/layer3/#entities-based
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - rke2-all-nodes.yaml
  - rke2-api.yaml
  - rke2-etcd.yaml
