apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: rke2-master-nodes
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: "true"
  ingress:
    # Kubernetes API from inside the cluster.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # RKE2 supervisor API and etcd from other nodes. `remote-node` includes
    # worker nodes. Don't remove it or replace it with the WireGuard CIDR
    # below: Cilium doesn't match cluster nodes by CIDR, so the nodes would
    # lose these ports.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9345" # RKE2 supervisor API
              protocol: TCP
            - port: "2379" # etcd client
              protocol: TCP
            - port: "2380" # etcd peer
              protocol: TCP

    # The same ports from WireGuard peers that aren't cluster nodes yet: a
    # master joining the cluster, or an admin's machine.
    - fromCIDR:
        - 10.0.0.0/24
      toPorts:
        - ports:
            - port: "6443" # Kubernetes API
              protocol: TCP
            - port: "9345" # RKE2 supervisor API
              protocol: TCP
            - port: "2379" # etcd client
              protocol: TCP
            - port: "2380" # etcd peer
              protocol: TCP
