apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: rke2-master-nodes
spec:
  nodeSelector:
    matchLabels:
      node-role.kubernetes.io/control-plane: "true"
  ingress:
    # Kubernetes API from inside the cluster.
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP

    # RKE2 supervisor API from other nodes. `remote-node` includes worker
    # nodes, which join through it. Don't remove it or replace it with the
    # WireGuard CIDR below: Cilium doesn't match cluster nodes by CIDR, so
    # the nodes would lose this port.
    - fromEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9345" # RKE2 supervisor API
              protocol: TCP

    # The same ports from WireGuard peers that aren't cluster nodes yet: a
    # node joining the cluster, or an admin's machine. etcd has its own
    # policy, in etcd.yaml.
    - fromCIDR:
        - 10.0.0.0/24
      toPorts:
        - ports:
            - port: "6443" # Kubernetes API
              protocol: TCP
            - port: "9345" # RKE2 supervisor API
              protocol: TCP
