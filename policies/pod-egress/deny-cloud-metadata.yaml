# No pod may reach the clouds' metadata services, which can hand out the
# instance's identity and credentials. A deny wins over any allow, so a
# tenant's own NetworkPolicy can't open it. The nodes themselves still can.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: deny-cloud-metadata
spec:
  endpointSelector: {}
  # Deny only this, without making every pod default-deny.
  enableDefaultDeny:
    ingress: false
    egress: false
  egressDeny:
    - toCIDR:
        # Link-local, where Tencent's (169.254.0.23) and the usual
        # 169.254.169.254 live.
        - 169.254.0.0/16
