apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: local-path-provisioner
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 5m

  chart:
    spec:
      chart: ./deploy/chart/local-path-provisioner
      sourceRef:
        kind: GitRepository
        name: local-path-provisioner
  releaseName: local-path-provisioner
  targetNamespace: local-path-storage
  storageNamespace: local-path-storage

  values:
    # The default StorageClass, so a PVC without one gets a local volume.
    storageClass:
      defaultClass: true
    nodePathMap:
      - node: DEFAULT_PATH_FOR_NON_LISTED_NODES
        paths:
          - /opt/local-path-provisioner

    # Pinned instead of the chart's busybox:latest.
    helperImage:
      tag: "1.37.0"

    # On the masters, where tenants' pods can't run: it can start pods that
    # mount any node's disk, on any node.
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
