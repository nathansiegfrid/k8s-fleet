groups:
  - name: workloads
    rules:
      # Each pod's workload: what owns it, through its ReplicaSet for a
      # Deployment or Rollout. Named as in the kubernetes-mixin. Static pods
      # and pods without an owner aren't here; dashboards use the pod's name.
      - record: namespace_workload_pod:kube_pod_owner:relabel
        # Owners are kept for 5 minutes after they're gone, as long as a
        # deleted pod's usage can still show.
        expr: |
          topk by (namespace, pod) (1,
            max by (namespace, pod, workload, workload_type) (
              label_replace(
                last_over_time(kube_pod_owner{owner_kind="ReplicaSet"}[5m]),
                "replicaset", "$1", "owner_name", "(.+)"
              )
              * on (namespace, replicaset) group_left (workload, workload_type)
              max by (namespace, replicaset, workload, workload_type) (
                label_replace(label_replace(
                  last_over_time(kube_replicaset_owner{owner_kind!~"|<none>"}[5m]),
                  "workload", "$1", "owner_name", "(.+)"),
                  "workload_type", "$1", "owner_kind", "(.+)")
                # A ReplicaSet without an owner is its own workload.
                or label_replace(label_replace(
                  last_over_time(kube_replicaset_owner{owner_kind=~"|<none>"}[5m]),
                  "workload", "$1", "replicaset", "(.+)"),
                  "workload_type", "ReplicaSet", "", "")
              )
            )
            or
            # Owned directly: a DaemonSet, StatefulSet, Job or anything else.
            max by (namespace, pod, workload, workload_type) (
              label_replace(label_replace(
                last_over_time(kube_pod_owner{owner_kind!~"|ReplicaSet|Node|<none>"}[5m]),
                "workload", "$1", "owner_name", "(.+)"),
                "workload_type", "$1", "owner_kind", "(.+)")
            )
          )
