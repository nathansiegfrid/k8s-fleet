# The Prometheus server, its role, and its values.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - oci-repository.yaml
  - rbac.yaml
  - helm-release.yaml

configMapGenerator:
  - name: prometheus-values
    namespace: flux-system
    files:
      - values.yaml
    options:
      # HelmRelease.valuesFrom can't follow kustomize's hash suffix.
      disableNameSuffixHash: true
      labels:
        # Upgrade the release as soon as values.yaml changes.
        reconcile.fluxcd.io/watch: Enabled
