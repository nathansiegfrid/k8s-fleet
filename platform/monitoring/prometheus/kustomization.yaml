# The Prometheus server, RBAC role, values, and alerting rules.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - oci-repository.yaml
  - rbac.yaml
  - helm-release.yaml

configMapGenerator:
  - name: prometheus-values
    namespace: flux-system
    files:
      - values.yaml
    options:
      # HelmRelease.valuesFrom can't follow kustomize's hash suffix.
      disableNameSuffixHash: true
      labels:
        # Upgrade the release as soon as values.yaml changes.
        reconcile.fluxcd.io/watch: Enabled

  # Every rule file, one key per file, mounted into Prometheus and its
  # reload sidecar. An edit reloads the rules without a Helm upgrade.
  - name: prometheus-rules
    namespace: monitoring
    files:
      - rules/nodes.yaml
      - rules/targets.yaml
      - rules/kubernetes.yaml
      - rules/monitoring.yaml
      - rules/workloads.yaml
    options:
      disableNameSuffixHash: true
