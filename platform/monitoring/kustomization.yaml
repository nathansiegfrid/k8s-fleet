# The monitoring stack, one HelmRelease per part: the exporters, Prometheus
# and Grafana.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - oci-repositories.yaml
  - node-exporter.yaml
  - kube-state-metrics.yaml
  - prometheus-rbac.yaml
  - prometheus.yaml
  - network-policies.yaml
  - grafana.yaml
  - grafana-route.yaml
  # Created with `sops`, so it's never in git in plaintext.
  - grafana-admin.sops.yaml

configMapGenerator:
  - name: prometheus-values
    namespace: flux-system
    files:
      - prometheus-values.yaml
    options:
      # HelmRelease.valuesFrom can't follow kustomize's hash suffix.
      disableNameSuffixHash: true
      labels:
        # Upgrade the release as soon as prometheus-values.yaml changes.
        reconcile.fluxcd.io/watch: Enabled
