# What Prometheus's discovery and scrapes need, and nothing more: no Secrets,
# no ConfigMaps, and no nodes/proxy, which reaches every kubelet's API
# through the API server, exec included. The chart's own role reads ConfigMaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-server
rules:
  # Discovery: nodes, and EndpointSlices with their Services and pods.
  - apiGroups: [""]
    resources: [nodes, services, pods]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  # The kubelets' /metrics and /metrics/cadvisor, checked by each kubelet.
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
  # The API server's own /metrics.
  - nonResourceURLs: [/metrics]
    verbs: [get]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-server
subjects:
  - kind: ServiceAccount
    name: prometheus-server
    namespace: monitoring
