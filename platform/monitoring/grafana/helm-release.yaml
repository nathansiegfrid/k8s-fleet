# Grafana, reading Prometheus. Reached at grafana.siegfrid.com through the
# private Gateway, so only over the VPN.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 5m

  chartRef:
    kind: OCIRepository
    name: grafana
  releaseName: grafana
  targetNamespace: monitoring
  storageNamespace: monitoring

  values:
    # The admin login, from grafana-admin.sops.yaml.
    admin:
      existingSecret: grafana-admin
    # Grafana encrypts the credentials it stores with this key, and its
    # built-in default is public.
    envValueFrom:
      GF_SECURITY_SECRET_KEY:
        secretKeyRef:
          name: grafana-admin
          key: secret-key

    grafana.ini:
      server:
        root_url: https://grafana.siegfrid.com
      # Grafana opens on Cluster Health instead of its own home page.
      dashboards:
        default_home_dashboard_path: /var/lib/grafana/dashboards/homelab/cluster-health.json

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://prometheus-server.monitoring.svc
            access: proxy
            isDefault: true
            jsonData:
              # Value of `server.global.scrape_interval` in prometheus/values.yaml.
              timeInterval: 30s
          # Alerts and silences, behind Grafana's login.
          - name: Alertmanager
            type: alertmanager
            uid: alertmanager
            url: http://alertmanager.monitoring.svc:9093
            access: proxy
            jsonData:
              implementation: prometheus
              # Alerts from rules made in Grafana go here too, so this one
              # Alertmanager routes, inhibits and silences every alert.
              handleGrafanaManagedAlerts: true

    # Dashboards are the JSON files in dashboards/, which Grafana provisions
    # itself from a mounted ConfigMap. Git is the source: Grafana won't save
    # changes to one, and offers its JSON to copy instead.
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: homelab
            type: file
            allowUiUpdates: false
            disableDeletion: true
            options:
              path: /var/lib/grafana/dashboards/homelab
    dashboardsConfigMaps:
      homelab: grafana-dashboards

    # Users, preferences and anything made in the UI live in its SQLite
    # database, on a local-path volume, with one pod at a time using it.
    persistence:
      enabled: true
      size: 1Gi
    deploymentStrategy:
      type: Recreate
    # local-path directories are writable by any user, so no root init
    # container to change their owner.
    initChownData:
      enabled: false

    # No sidecars, so it needs no API access: no token and no role.
    automountServiceAccountToken: false
    rbac:
      create: false
    testFramework:
      enabled: false

    # Grafana 13 used 432Mi idle, right after starting.
    resources:
      requests:
        cpu: 50m
        memory: 512Mi
      limits:
        memory: 1Gi
