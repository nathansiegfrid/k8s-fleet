# ServiceAccount for logging in to Kiali. Kiali displays only the resources
# this account's token is allowed to read. To revoke the token, delete this
# ServiceAccount and let Flux recreate it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kiali-login
  namespace: monitoring

---
# Kiali's own read rules, with port-forward and Secrets excluded.
# port-forward would bypass every NetworkPolicy.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kiali-login
rules:
  - apiGroups: [""]
    resources:
      - configmaps
      - namespaces
      - pods
      - pods/log
      - replicationcontrollers
      - services
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [daemonsets, deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list, watch]
  - apiGroups:
      - networking.istio.io
      - security.istio.io
      - extensions.istio.io
      - telemetry.istio.io
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [gateway.networking.k8s.io]
    resources:
      - gatewayclasses
      - gateways
      - grpcroutes
      - httproutes
      - referencegrants
      - tcproutes
      - tlsroutes
      - udproutes
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources: [mutatingwebhookconfigurations]
    verbs: [list]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kiali-login
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kiali-login
subjects:
  - kind: ServiceAccount
    name: kiali-login
    namespace: monitoring
