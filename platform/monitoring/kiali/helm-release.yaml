# Kiali shows the mesh's traffic from Prometheus's metrics. Served at
# kiali.siegfrid.org via the private Gateway, reachable only over the VPN.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kiali
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 5m

  chart:
    spec:
      chart: kiali-server
      version: "2.35.0"
      sourceRef:
        kind: HelmRepository
        name: kiali
  releaseName: kiali
  targetNamespace: monitoring
  storageNamespace: monitoring

  values:
    # No login for now: anyone on the VPN who reaches the private Gateway
    # can use it. To be tightened once its traffic has been observed.
    auth:
      strategy: anonymous
    # Read-only, so anonymous users can't change the mesh's config.
    deployment:
      view_only_mode: true
      # The chart's default policy lets any pod in.
      # We define our own in network-policy.yaml.
      network_policy:
        enabled: false
    server:
      web_root: /
    external_services:
      prometheus:
        url: http://prometheus-server.monitoring.svc
      # Kiali's Grafana links are for Istio's dashboards, and our Grafana has none.
      # Connecting the two would also need a Grafana login for Kiali.
      grafana:
        enabled: false
