# Kiali shows the mesh's traffic from Prometheus's metrics. Served at
# kiali.siegfrid.org via the private Gateway, reachable only over the VPN.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kiali
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 5m

  chart:
    spec:
      chart: kiali-server
      version: "2.35.0"
      sourceRef:
        kind: HelmRepository
        name: kiali
  releaseName: kiali
  targetNamespace: monitoring
  storageNamespace: monitoring

  values:
    # Log in with a token for kiali-login. RBAC defined in login.yaml.
    auth:
      strategy: token
    # A fixed key which lasts 30 days, so upgrades don't end the session.
    login_token:
      signing_key: secret:kiali-signing-key:key
      expiration_seconds: 2592000
    # Read-only, so Kiali can't change the mesh's config.
    deployment:
      view_only_mode: true
      # The chart's default policy lets any pod in.
      # We define our own in network-policy.yaml.
      network_policy:
        enabled: false
    server:
      web_root: /
    external_services:
      prometheus:
        url: http://prometheus-server.monitoring.svc
      # Kiali's Grafana links are for Istio's dashboards, and our Grafana has none.
      # Connecting the two would also need a Grafana login for Kiali.
      grafana:
        enabled: false
      # Kiali polls istiod by port-forward, which it can't do any more.
      istio:
        istio_api_enabled: false

  # Port-forward bypasses every NetworkPolicy, so Kiali gets it in the
  # gateway namespace only, from platform/gateway/kiali-port-forward.yaml.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: ClusterRole
              name: kiali-viewer
            # The test fails the upgrade if a new chart moves the rule.
            patch: |
              - op: test
                path: /rules/2/resources
                value: [pods/portforward]
              - op: remove
                path: /rules/2
