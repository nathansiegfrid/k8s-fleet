apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - name: private-gateway
      namespace: gateway
      sectionName: https
  hostnames:
    - grafana.siegfrid.com
  rules:
    - backendRefs:
        - name: grafana
          port: 80
