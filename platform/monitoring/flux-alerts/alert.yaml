# Errors only, for the platform's objects. Cross-namespace references are off,
# so a tenant's own Kustomization would need an Alert in its namespace.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: platform
  namespace: flux-system
spec:
  providerRef:
    name: alertmanager
  eventSeverity: error
  eventSources:
    - kind: Kustomization
      name: "*"
    - kind: HelmRelease
      name: "*"
    - kind: GitRepository
      name: "*"
    - kind: OCIRepository
      name: "*"
    - kind: HelmRepository
      name: "*"
    - kind: HelmChart
      name: "*"
