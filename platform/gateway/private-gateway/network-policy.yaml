# Load-balanced traffic goes straight to the pod, so the host firewall doesn't
# see it: this keeps the Gateway to WireGuard clients, whatever reaches it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: private-gateway
  namespace: gateway
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: private-gateway
  ingress:
    - fromCIDR:
        - 10.0.0.0/24
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # The kubelet's readiness probe on Envoy's status port.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "15021"
              protocol: TCP
