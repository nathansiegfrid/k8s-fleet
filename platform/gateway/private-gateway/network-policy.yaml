# Load-balanced traffic goes straight to the pod, so the host firewall doesn't
# see it: this keeps the Gateway to WireGuard clients, whatever reaches it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-gateway
  namespace: gateway
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: private-gateway
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.0.0/24
      ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
    # Prometheus scrapes Envoy's metrics, such as requests by status code.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
      ports:
        - port: 15020
          protocol: TCP
