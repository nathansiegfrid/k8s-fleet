# A Gateway reachable only over the VPN, for platform UIs such as Grafana.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private-gateway
  namespace: gateway
  annotations:
    # external-dns creates a CNAME for each tenant hostname routed through
    # this Gateway, pointing at private-gateway.siegfrid.com.
    # The actual IPs are defined in dns-endpoint.yaml.
    external-dns.kubernetes.io/target: private-gateway.siegfrid.com
spec:
  gatewayClassName: istio
  # The Service from helm-release.yaml, rather than one istiod generates.
  addresses:
    - type: Hostname
      value: private-gateway.gateway.svc.cluster.local
  listeners:
    # Only the platform's redirect to HTTPS attaches here.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.siegfrid.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: siegfrid-com-tls
      # Limited to platform and admin namespaces.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [monitoring, tenant-01-workbench]
    - name: siegfrid-org
      protocol: HTTPS
      port: 443
      hostname: "*.siegfrid.org"
      tls:
        mode: Terminate
        certificateRefs:
          - name: siegfrid-org-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values:
                  - tenant-01
                  - tenant-01-workbench
