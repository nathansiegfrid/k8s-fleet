# Every VPN client reaches this Gateway, so we list which names each one may
# open, and Envoy rejects the rest with a 403. A client added to the VPN can
# access only the private hosts explicitly allowed here.
# Each host is listed both with and without :443 because some clients include
# the port in the Host header.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: private-gateway
  namespace: gateway
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: private-gateway
  action: ALLOW
  rules:
    # Allow Kiali for all VPN clients.
    # Kiali shows only what the client's own token is permitted to read.
    - from:
        - source:
            ipBlocks: [10.0.3.0/24]
      to:
        - operation:
            hosts:
              - kiali.siegfrid.org
              - kiali.siegfrid.org:443
    # Admin machines: every private name.
    - from:
        - source:
            ipBlocks: [10.0.3.1/32, 10.0.3.2/32]
