# Wildcard TLS certificate, issued by Let's Encrypt via cert-manager.
# Wildcard names require a DNS-01 challenge, so the "letsencrypt" ClusterIssuer
# must have a DNS-01 solver configured.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: siegfrid-org-tls
  namespace: gateway
spec:
  secretName: siegfrid-org-tls
  dnsNames:
    - siegfrid.org
    - "*.siegfrid.org"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
