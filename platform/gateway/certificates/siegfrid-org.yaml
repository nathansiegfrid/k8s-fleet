# Validated like a tenant's own domain: `_acme-challenge.siegfrid.org` is a
# CNAME into siegfrid.com, where the issuer writes the TXT record.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: siegfrid-org-tls
  namespace: gateway
spec:
  secretName: siegfrid-org-tls
  dnsNames:
    - siegfrid.org
    - "*.siegfrid.org"
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt
