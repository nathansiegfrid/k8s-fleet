# Let's Encrypt, validated with DNS-01 through Cloudflare's API. The token
# is cert-manager's own, in the cert-manager namespace.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          # Follow `_acme-challenge` CNAMEs when placing the TXT record. This lets
          # domains with DNS hosted elsewhere delegate validation to siegfrid.org:
          # CNAME `_acme-challenge.<domain>` to `<domain>.acme.siegfrid.org`.
          cnameStrategy: Follow
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: token
