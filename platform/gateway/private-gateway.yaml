# A Gateway reachable only over the VPN, for platform UIs such as Grafana.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: private-gateway
  namespace: gateway
  annotations:
    # external-dns points its hostnames at the workers' WireGuard addresses.
    external-dns.kubernetes.io/target: 10.0.0.11,10.0.0.12
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: private-gateway
  listeners:
    # Only the platform's redirect to HTTPS attaches here.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.siegfrid.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: public-tls
      # Limited to platform and admin namespaces.
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [monitoring, tenant-01-workbench]

---
# Istio overlays these on the resources it generates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: private-gateway
  namespace: gateway
data:
  # Each worker takes the traffic to its own WireGuard address, from the pool
  # below, and serves it with its own Gateway pod, which keeps the client's IP.
  service: |
    metadata:
      annotations:
        lbipam.cilium.io/ips: "10.0.0.11,10.0.0.12"
    spec:
      type: LoadBalancer
      allocateLoadBalancerNodePorts: false
      externalTrafficPolicy: Local
      # Envoy's status port stays off the WireGuard addresses.
      ports:
        - "$patch": delete
          port: 15021
  # One pod per worker. A rollout starts the new pods before stopping the old
  # ones, so neither address is left without a pod.
  deployment: |
    spec:
      replicas: 2
      strategy:
        rollingUpdate:
          maxSurge: 100%
          maxUnavailable: 0
      template:
        spec:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              # Count only the workers: the empty masters would block every pod.
              nodeTaintsPolicy: Honor
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: private-gateway
  # A drain can't take both pods at once.
  podDisruptionBudget: |
    spec:
      minAvailable: 1

---
# Load-balanced traffic goes straight to the pod, so the host firewall doesn't
# see it: this keeps the Gateway to WireGuard clients, whatever reaches it.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: private-gateway
  namespace: gateway
spec:
  endpointSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: private-gateway
  ingress:
    - fromCIDR:
        - 10.0.0.0/24
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # The kubelet's readiness probe on Envoy's status port.
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "15021"
              protocol: TCP

---
# The workers' own WireGuard addresses, so nothing needs to announce them.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: private-gateway
spec:
  blocks:
    - cidr: 10.0.0.11/32 # worker-sg11-hstgr
    - cidr: 10.0.0.12/32 # worker-sg12-tc
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: gateway
      io.kubernetes.service.name: private-gateway-istio
