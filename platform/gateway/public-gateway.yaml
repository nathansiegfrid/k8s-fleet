apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: gateway
  annotations:
    # external-dns points tenants' hostnames here, not at the Gateway's own
    # addresses, which include a VPC address the internet can't reach.
    external-dns.kubernetes.io/target: 156.67.221.137
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: public-gateway
  listeners:
    # Only the platform's redirect to HTTPS attaches here.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.siegfrid.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: public-tls
      # Routes attach from any namespace, for any subdomain. Restrict this
      # before a second tenant, who could claim the first one's hostname.
      allowedRoutes:
        namespaces:
          from: All

---
# Istio overlays these on the resources it generates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-gateway
  namespace: gateway
data:
  # Each worker takes the traffic to its own address, from the pool below,
  # and serves it with its own Gateway pod, which keeps the client's IP.
  service: |
    metadata:
      annotations:
        lbipam.cilium.io/ips: "156.67.221.137,10.3.0.16"
    spec:
      type: LoadBalancer
      allocateLoadBalancerNodePorts: false
      externalTrafficPolicy: Local
  # One pod per worker. A rollout starts the new pods before stopping the old
  # ones, so neither address is left without a pod.
  deployment: |
    spec:
      replicas: 2
      strategy:
        rollingUpdate:
          maxSurge: 100%
          maxUnavailable: 0
      template:
        spec:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  gateway.networking.k8s.io/gateway-name: public-gateway
  # A drain can't take both pods at once.
  podDisruptionBudget: |
    spec:
      minAvailable: 1

---
# The workers' own addresses, so nothing needs to announce them. The second
# is a VPC address: Tencent translates the public IP to it.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: public-gateway
spec:
  blocks:
    - cidr: 156.67.221.137/32 # worker-sg11-hstgr
    - cidr: 10.3.0.16/32 # worker-sg12-tc
  serviceSelector:
    matchLabels:
      io.kubernetes.service.namespace: gateway
      io.kubernetes.service.name: public-gateway-istio
