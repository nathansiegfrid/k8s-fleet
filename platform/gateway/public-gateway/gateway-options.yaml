# Istio overlays these on the resources it generates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-gateway
  namespace: gateway
data:
  # Each worker takes the traffic to its own address, from ip-pool.yaml,
  # and serves it with its own Gateway pod, which keeps the client's IP.
  service: |
    metadata:
      annotations:
        lbipam.cilium.io/ips: "156.67.221.137,10.3.0.16"
    spec:
      type: LoadBalancer
      allocateLoadBalancerNodePorts: false
      externalTrafficPolicy: Local
      # Envoy's status port stays off the public addresses.
      ports:
        - "$patch": delete
          port: 15021
  # One pod per worker. A rollout starts the new pods before stopping the old
  # ones, so neither address is left without a pod.
  deployment: |
    spec:
      replicas: 2
      strategy:
        rollingUpdate:
          maxSurge: 100%
          maxUnavailable: 0
      template:
        spec:
          # The rest of Pod Security's restricted level is in Istio's template.
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          affinity:
            # Only the workers whose addresses are in ip-pool.yaml.
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values: [worker-sg11-hstgr, worker-sg12-tc]
            # One pod of each rollout per node: a down worker's pod waits for it
            # instead of doubling up on the other.
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      gateway.networking.k8s.io/gateway-name: public-gateway
                  matchLabelKeys: [pod-template-hash]
  # A drain can't take both pods at once.
  podDisruptionBudget: |
    spec:
      minAvailable: 1
