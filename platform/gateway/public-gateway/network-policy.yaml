# Anyone may reach 80 and 443. Envoy's other ports stay closed, so tenants
# can't read each other's routes and status codes from its metrics.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: public-gateway
  namespace: gateway
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: public-gateway
  policyTypes: [Ingress]
  ingress:
    # No `from`: any source, the internet included.
    - ports:
        - port: 80
          protocol: TCP
        - port: 443
          protocol: TCP
    # Prometheus scrapes Envoy's metrics, such as requests by status code.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/component: server
      ports:
        - port: 15020
          protocol: TCP
