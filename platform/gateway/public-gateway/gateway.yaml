apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: gateway
  annotations:
    # external-dns creates a CNAME for each tenant hostname routed through
    # this Gateway, pointing at public-gateway.siegfrid.com.
    # The actual IPs are defined in dns-endpoint.yaml.
    external-dns.kubernetes.io/target: public-gateway.siegfrid.com
spec:
  gatewayClassName: istio
  # The Service from helm-release.yaml, rather than one istiod generates.
  addresses:
    - type: Hostname
      value: public-gateway.gateway.svc.cluster.local
  listeners:
    # Only the platform's redirect to HTTPS attaches here.
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.siegfrid.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: public-tls
      # Routes attach from any namespace, for any subdomain. Restrict this
      # before a second tenant, who could claim the first one's hostname.
      allowedRoutes:
        namespaces:
          from: All
