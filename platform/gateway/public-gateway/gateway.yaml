apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public-gateway
  namespace: gateway
  annotations:
    # external-dns creates a CNAME for each tenant hostname routed through
    # this Gateway, pointing at public-gateway.siegfrid.com.
    # The actual IPs are defined in dns-endpoint.yaml.
    external-dns.kubernetes.io/target: public-gateway.siegfrid.com
spec:
  gatewayClassName: istio
  # Use the Service defined in helm-release.yaml instead of having istiod
  # generate one.
  addresses:
    - type: Hostname
      value: public-gateway.gateway.svc.cluster.local
  # Tenants' own listeners come from ListenerSets that the platform writes in
  # this namespace. Tenants can't add listeners from theirs.
  allowedListeners:
    namespaces:
      from: Same
  listeners:
    # Plain-HTTP listener. Only for HTTPS redirect (https-redirect.yaml).
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: siegfrid-com
      protocol: HTTPS
      port: 443
      hostname: "*.siegfrid.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: siegfrid-com-tls
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: In
                values: [tenant-01]
