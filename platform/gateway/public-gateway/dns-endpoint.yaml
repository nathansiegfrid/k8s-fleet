# This Gateway's own name. Routes' records CNAME to it, and so can a tenant's
# DNS hosted elsewhere. Not the Gateway's addresses: one is a VPC address.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: public-gateway
  namespace: gateway
spec:
  endpoints:
    - dnsName: public-gateway.siegfrid.com
      recordType: A
      targets:
        - 156.67.221.137
        - 101.32.127.208
