# The Gateway's pods, one on each worker labelled for it in k8s-infra, and
# the Service it links to.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: public-gateway
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 5m

  # The same version as istiod, which configures it.
  dependsOn:
    - name: istiod

  chart:
    spec:
      chart: gateway
      version: "1.32.0"
      sourceRef:
        kind: HelmRepository
        name: istio
  releaseName: public-gateway
  targetNamespace: gateway
  storageNamespace: gateway

  values:
    kind: DaemonSet
    nodeSelector:
      siegfrid.org/public-gateway: "true"
    autoscaling:
      enabled: false
    labels:
      # Policies that target the Gateway find its pods by this label.
      gateway.networking.k8s.io/gateway-name: public-gateway
    # Gateway API gives Envoy its certificates; it needs no Role for Secrets.
    rbac:
      enabled: false
    # Replaces the chart's default, so the low-ports sysctl is repeated here.
    securityContext:
      sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      seccompProfile:
        type: RuntimeDefault
    # Each worker takes the traffic to its own address, from ip-pool.yaml, and
    # serves it with its own pod, which keeps the client's IP.
    service:
      type: LoadBalancer
      allocateLoadBalancerNodePorts: false
      externalTrafficPolicy: Local
      annotations:
        lbipam.cilium.io/ips: "156.67.221.137,10.3.0.16"
      # Only 80 and 443: the chart's default adds Envoy's status port.
      ports:
        - name: http
          port: 80
          targetPort: 80
          protocol: TCP
        - name: https
          port: 443
          targetPort: 443
          protocol: TCP

  # The chart sets a DaemonSet's rollout as `strategy`, which only a
  # Deployment has: start each node's new pod before stopping the old one.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: public-gateway
            patch: |
              - op: add
                path: /spec/updateStrategy
                value:
                  type: RollingUpdate
                  rollingUpdate:
                    maxSurge: 1
                    maxUnavailable: 0
