# The Gateway's pods: one on each worker labelled for it in k8s-infra, and
# its Service. Not linked to the Gateway yet, so they carry no traffic.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: public-gateway
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 5m

  # The same version as istiod, which configures it.
  dependsOn:
    - name: istiod

  chart:
    spec:
      chart: gateway
      version: "1.32.0"
      sourceRef:
        kind: HelmRepository
        name: istio
  releaseName: public-gateway
  targetNamespace: gateway
  storageNamespace: gateway

  values:
    kind: DaemonSet
    nodeSelector:
      siegfrid.com/public-gateway: "true"
    autoscaling:
      enabled: false
    # Gateway API gives Envoy its certificates; it needs no Role for Secrets.
    rbac:
      enabled: false
    # Replaces the chart's default, so the low-ports sysctl is repeated here.
    securityContext:
      sysctls:
        - name: net.ipv4.ip_unprivileged_port_start
          value: "0"
      seccompProfile:
        type: RuntimeDefault
    service:
      type: ClusterIP
      ports:
        - name: http
          port: 80
          targetPort: 80
          protocol: TCP
        - name: https
          port: 443
          targetPort: 443
          protocol: TCP

  # The chart sets a DaemonSet's rollout as `strategy`, which only a
  # Deployment has: start each node's new pod before stopping the old one.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: public-gateway
            patch: |
              - op: add
                path: /spec/updateStrategy
                value:
                  type: RollingUpdate
                  rollingUpdate:
                    maxSurge: 1
                    maxUnavailable: 0
