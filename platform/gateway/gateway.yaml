apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: public
  namespace: gateway
spec:
  gatewayClassName: istio
  infrastructure:
    parametersRef:
      group: ""
      kind: ConfigMap
      name: public-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # Routes attach from any namespace, for any hostname. Restrict this
      # before a second tenant, who could claim the first one's hostname.
      allowedRoutes:
        namespaces:
          from: All

---
# Istio overlays these on the Service and Deployment it generates.
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-gateway
  namespace: gateway
data:
  # There's no load balancer: traffic reaches the pod on its node's port 80.
  service: |
    spec:
      type: ClusterIP
  # hostPort, not hostNetwork: Envoy can bind port 80 as non-root only in its
  # own network namespace. The old pod has to free the port before the new one
  # starts.
  deployment: |
    spec:
      strategy:
        rollingUpdate:
          maxSurge: 0
          maxUnavailable: 1
      template:
        spec:
          containers:
            - name: istio-proxy
              ports:
                - containerPort: 80
                  hostPort: 80
                  protocol: TCP
