# Pods here accept connections from this namespace only, so no other pod can
# read the cluster's flows through Hubble Relay. The agents and operator use
# the host network, which this doesn't touch.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-network-policy
  namespace: cilium-system
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
