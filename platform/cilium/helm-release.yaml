apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 10m

  chartRef:
    kind: OCIRepository
    name: cilium
  releaseName: cilium
  targetNamespace: cilium-system
  storageNamespace: cilium-system

  valuesFrom:
    - kind: ConfigMap
      name: cilium-values
      valuesKey: values.yaml
