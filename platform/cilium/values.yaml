# Cilium is the CNI and the host firewall. Istio provides the mesh and
# Gateway API, so Cilium's own Envoy, L7 proxy and gateway stay off.
#
# k8s-infra installs Cilium with this file before Flux exists, so every
# value here must work on a cluster with no other components yet.

# Override the destination namespace for Cilium resources.
namespaceOverride: cilium-system

# kube-proxy isn't deployed on this cluster, so Cilium replaces it.
kubeProxyReplacement: true
# On RKE2, localhost:6443 works on every node: the agent runs a built-in
# load balancer on workers that forwards to the masters' API servers.
k8sServiceHost: localhost
k8sServicePort: "6443"

# Keep Cilium Operator on the control-plane nodes, where tenants' pods
# can't run: its token reads every Secret in the cluster and can rewrite
# network policies, so a container escape on a worker mustn't reach it.
operator:
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"

# Take pod CIDRs from Kubernetes (RKE2's 10.42.0.0/16). Cilium's default
# 10.0.0.0/8 pool overlaps the WireGuard network.
ipam:
  mode: kubernetes

# The policies are in /policies/host-firewall. Until they're applied, the
# host firewall allows everything.
# https://docs.cilium.io/en/latest/security/host-firewall/
hostFirewall:
  enabled: true

# Log what the policies would drop instead of dropping it, while the host
# firewall policies are new. It applies to every endpoint, pods included,
# so turn it off before tenants arrive. The agents read it only at startup:
# after a change, run `kubectl -n cilium-system rollout restart ds/cilium`.
policyAuditMode: true

# Derive node identities from the control-plane label so host policies can
# tell masters from workers with fromNodes. The nodeLabels filter groups nodes
# into two shared identities, masters and workers, instead of one unique
# identity per node.
# When off (default), fromNodes matches nothing.
nodeSelectorLabels: true
nodeLabels: 'node-role\.kubernetes\.io/control-plane'

# === ISTIO AMBIENT SUPPORT ===

# Let Istio's CNI plugin chain after Cilium.
cni:
  exclusive: false

# Keep eBPF socket load balancing in the host namespace, so it doesn't
# bypass ztunnel.
socketLB:
  enabled: true
  hostNamespaceOnly: true

# === HUBBLE ===

# Flow visibility: every flow Cilium handles, with its policy verdict, and
# drops with their reason, the host firewall's included. The relay gathers
# all nodes' flows for the UI. The UI has no login, so reach it through a
# port-forward, never a route.
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true

# === UNUSED COMPONENTS ===
envoy:
  enabled: false
l7Proxy: false

# === GATEWAY API SUPPORT ===
# Disabled: Istio is the cluster's Gateway API implementation.

# Enable Gateway API (requires kubeProxyReplacement=true and l7Proxy=true).
# gatewayAPI:
#   enabled: true
#   # Use host network instead of LoadBalancer service.
#   hostNetwork:
#     enabled: true

# Allow Gateway API listeners to bind to privileged ports when using host network mode.
# https://docs.cilium.io/en/latest/network/servicemesh/gateway-api/host-network-mode/#bind-to-privileged-port
# envoy:
#   enabled: true
#   securityContext:
#     capabilities:
#       keepCapNetBindService: true
#       envoy:
#         - NET_BIND_SERVICE # Allow Envoy to bind to privileged ports (<= 1023).
#         - NET_ADMIN
#         # Both PERFMON and BPF requires kernel 5.8, container runtime
#         # cri-o >= v1.22.0 or containerd >= v1.5.0.
#         - PERFMON
#         - BPF
