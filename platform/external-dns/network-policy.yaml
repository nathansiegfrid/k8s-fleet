# Pods here accept connections from this namespace only. The only port is
# external-dns's metrics, and nothing outside scrapes them.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-network-policy
  namespace: external-dns
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
