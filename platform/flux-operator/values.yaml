# ResourceSets outside flux-system must name a ServiceAccount to run as.
# The tenants ResourceSet lives in flux-system, so it keeps the operator's
# own permissions.
multitenancy:
  enabled: true

# Keep Flux Operator on the control-plane nodes, where tenants' pods can't
# run: its token is cluster-admin, so a container escape on a worker
# mustn't reach it. The toleration is for the masters' NoSchedule taint.
nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
