# k8s-infra installs this component before Flux exists, from the same files:
# the chart and version in oci-repository.yaml, the release name and
# namespace in helm-release.yaml, and values.yaml. Flux then adopts the
# release.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - oci-repository.yaml
  - helm-release.yaml

configMapGenerator:
  - name: flux-operator-values
    namespace: flux-system
    files:
      - values.yaml
    options:
      # HelmRelease.valuesFrom can't follow kustomize's hash suffix.
      disableNameSuffixHash: true
      labels:
        # Upgrade the release as soon as values.yaml changes.
        reconcile.fluxcd.io/watch: Enabled
