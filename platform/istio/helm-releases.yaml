# Istio in ambient mode: four charts on the same version, installed in this
# order. Bump them together.
#
# Upgrades are in place. A revisioned istiod would allow a canary upgrade,
# but Flux can't run one: renaming the HelmRelease uninstalls the old istiod
# in the same apply that installs the new one.

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-base
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 5m

  chart:
    spec:
      chart: base
      version: "1.31.4"
      sourceRef:
        kind: HelmRepository
        name: istio
  releaseName: istio-base
  targetNamespace: istio-system
  storageNamespace: istio-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istio-cni
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 5m

  dependsOn:
    - name: istio-base

  chart:
    spec:
      chart: cni
      version: "1.31.4"
      sourceRef:
        kind: HelmRepository
        name: istio
  releaseName: istio-cni
  targetNamespace: istio-system
  storageNamespace: istio-system

  values:
    profile: ambient

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: istiod
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 5m

  dependsOn:
    - name: istio-cni

  chart:
    spec:
      chart: istiod
      version: "1.31.4"
      sourceRef:
        kind: HelmRepository
        name: istio
  releaseName: istiod
  targetNamespace: istio-system
  storageNamespace: istio-system

  values:
    profile: ambient

    # istiod's ServiceAccount can read every Secret in the cluster, so it
    # runs on the control-plane nodes, away from tenant workloads.
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

    # The chart requests 500m CPU and 2Gi memory by default, which doesn't
    # fit on a control-plane node next to etcd and the API server. One fixed
    # replica, so the autoscaler doesn't add more against the low request.
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
    autoscaleEnabled: false
    replicaCount: 1

---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ztunnel
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 5m

  dependsOn:
    - name: istiod

  chart:
    spec:
      chart: ztunnel
      version: "1.31.4"
      sourceRef:
        kind: HelmRepository
        name: istio
  releaseName: ztunnel
  targetNamespace: istio-system
  storageNamespace: istio-system
