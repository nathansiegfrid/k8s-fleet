apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
  namespace: flux-system
spec:
  serviceAccountName: helm-controller
  interval: 1h
  timeout: 5m

  chartRef:
    kind: OCIRepository
    name: cert-manager
  releaseName: cert-manager
  targetNamespace: cert-manager
  storageNamespace: cert-manager

  values:
    crds:
      enabled: true

    # Don't add cert-manager's roles to `admin`: a tenant could request a
    # certificate for any name in the zone from the platform's issuer.
    global:
      rbac:
        aggregateClusterRoles: false

    # On the masters, where tenants' pods can't run: the controller writes
    # Secrets in every namespace and holds the Cloudflare token.
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
    webhook:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    cainjector:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
    startupapicheck:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
