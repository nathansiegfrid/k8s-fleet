# Pods here accept connections from this namespace only, plus the API server
# calling the webhook.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-network-policy
  namespace: cert-manager
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}

---
# The API server calls the webhook to check cert-manager's objects. From
# the other masters, the call comes from their pod-network address, not
# the API server's, so it doesn't match the `kube-apiserver` identity.
# Allow them by node instead.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager-webhook
  namespace: cert-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/component: webhook
  ingress:
    - fromNodes:
        - matchLabels:
            node-role.kubernetes.io/control-plane: "true"
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
